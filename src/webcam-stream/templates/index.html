<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Live Stream</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Video -->
  <video id="vid" autoplay muted playsinline></video>

  <!-- Vignette overlay -->
  <div class="vignette"></div>

  <!-- Scanline effect -->
  <div class="scanline"></div>

  <!-- Corner decorations -->
  <div class="corners">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
  </div>

  <!-- Crosshair -->
  <div class="crosshair"><div class="crosshair-ring"></div></div>

  <!-- Side labels -->
  <div class="side-label side-label-left">LOW LATENCY</div>
  <div class="side-label side-label-right">CAR STREAM</div>

  <!-- Watermark -->
  <div class="watermark">REC &bull; CAM-01</div>

  <!-- Top bar -->
  <header class="bar-top">
    <div class="badge-group">
      <div class="live-badge">
        <span class="live-dot"></span>
        <span class="live-text">LIVE</span>
      </div>
      <span id="status" class="status-pill">&#x2713; CONNECTED</span>
    </div>
    <div class="info-group">
      <span class="info-tag">H.264</span>
      <span id="res" class="info-tag res">--</span>
      <span id="bw" class="info-tag">-- KB/s</span>
    </div>
  </header>

  <!-- Bottom bar -->
  <footer class="bar-bottom">
    <div class="stats-left">
      <div class="stat">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <b id="fps">--</b>
        <span class="unit">FPS</span>
      </div>
      <span class="dim">fMP4</span>
    </div>
    <div class="stats-right">
      <span id="time" class="stat">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 6v6l4 2"/>
        </svg>
        --:--:--
      </span>
      <span class="signal-dot"></span>
    </div>
  </footer>

  <script>
    const vid = document.getElementById('vid');
    const fpsEl = document.getElementById('fps');
    const resEl = document.getElementById('res');
    const bwEl = document.getElementById('bw');
    const timeEl = document.getElementById('time');
    const statusEl = document.getElementById('status');

    // FPS counter + zero-fps watchdog
    let frames = 0, lastFps = performance.now();
    let zeroFpsCount = 0;
    if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
      function countFrame() { frames++; vid.requestVideoFrameCallback(countFrame); }
      vid.requestVideoFrameCallback(countFrame);
    }
    setInterval(() => {
      const elapsed = (performance.now() - lastFps) / 1000;
      const currentFps = elapsed > 0 ? Math.round(frames / elapsed) : 0;
      fpsEl.textContent = currentFps || '--';
      if (currentFps === 0) {
        zeroFpsCount++;
        if (zeroFpsCount >= 2) {
          zeroFpsCount = 0;
          console.warn('0 FPS for 2s, reconnecting...');
          statusEl.textContent = '\u21bb RECONNECTING';
          statusEl.className = 'status-pill warning';
          location.reload();
        }
      } else {
        zeroFpsCount = 0;
      }
      frames = 0;
      lastFps = performance.now();
    }, 1000);

    // Clock
    setInterval(() => {
      timeEl.innerHTML = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 6v6l4 2"/>
        </svg> ${new Date().toLocaleTimeString()}`;
    }, 500);

    // Resolution
    vid.addEventListener('loadedmetadata', () => {
      resEl.textContent = `${vid.videoWidth} \u00d7 ${vid.videoHeight}`;
    });

    // MSE Player
    const MIME = 'video/mp4; codecs="avc1.42c01f"';
    let totalBytes = 0, bwStart = performance.now();

    setInterval(() => {
      const elapsed = (performance.now() - bwStart) / 1000;
      if (elapsed > 0) bwEl.textContent = Math.round(totalBytes / elapsed / 1024) + ' KB/s';
      totalBytes = 0;
      bwStart = performance.now();
    }, 2000);

    async function startStream() {
      if (!MediaSource.isTypeSupported(MIME)) {
        statusEl.textContent = '\u2717 MSE not supported';
        statusEl.className = 'status-pill error';
        return;
      }

      const ms = new MediaSource();
      vid.src = URL.createObjectURL(ms);
      await new Promise(r => ms.addEventListener('sourceopen', r, { once: true }));

      const sb = ms.addSourceBuffer(MIME);
      sb.mode = 'sequence';

      const resp = await fetch('/stream');
      const reader = resp.body.getReader();
      const queue = [];
      let appending = false;

      function tryAppend() {
        if (appending || queue.length === 0 || sb.updating) return;
        appending = true;
        const chunk = queue.shift();
        try {
          sb.appendBuffer(chunk);
        } catch (e) {
          if (e.name === 'QuotaExceededError' && vid.currentTime > 5) {
            sb.remove(0, vid.currentTime - 2);
          }
          appending = false;
        }
      }

      sb.addEventListener('updateend', () => {
        appending = false;
        if (vid.paused && vid.buffered.length > 0) vid.play();
        tryAppend();
      });

      // Live edge sync – aggressive low-latency
      setInterval(() => {
        if (vid.buffered.length === 0) return;
        const end = vid.buffered.end(vid.buffered.length - 1);
        const lag = end - vid.currentTime;
        if (lag > 0.15) {
          vid.currentTime = end - 0.02;
          vid.playbackRate = 1.0;
        } else if (lag > 0.08) {
          vid.playbackRate = 1.08;
        } else {
          vid.playbackRate = 1.0;
        }
        if (!sb.updating && vid.currentTime > 3) {
          try { sb.remove(0, vid.currentTime - 1); } catch (e) {}
        }
      }, 50);

      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        totalBytes += value.byteLength;
        queue.push(value);
        tryAppend();
      }
    }

    startStream().catch(err => {
      console.error(err);
      statusEl.textContent = '\u2717 ERROR';
      statusEl.className = 'status-pill error';
      setTimeout(() => location.reload(), 3000);
    });
  </script>
</body>
</html>
